<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDeATe Lending item guide</title>
<style>
:root { --bg:#f6f6f4; --fg:#16181c; --dim:#5c6370; --panel:#ffffff; --accent:#a6192e; }
@media (prefers-color-scheme: dark) { :root { --bg:#111317; --fg:#eceef1; --dim:#9ba3b0; --panel:#1a1d23; --accent:#ff8a8a; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; }
main { max-width:560px; margin:0 auto; padding:24px 16px 56px; display:flex; flex-direction:column; gap:24px; }
h1 { font-size:26px; line-height:1.2; margin:0; text-wrap:balance; }
h2 { font-size:15px; margin:0 0 6px; color:var(--dim); font-weight:600; }
p, ul { margin:0; } ul { padding-left:20px; }
a { color:var(--accent); }
.where { background:var(--panel); padding:16px; font-size:20px; font-weight:600; }
.where .note { font-size:14px; font-weight:400; color:var(--dim, #8a93a3); margin-top:6px; }
.sub { color:var(--dim); }
input { width:100%; font:inherit; padding:12px; background:var(--panel); color:var(--fg); border:0; }
.list a { display:block; padding:10px 0; text-decoration:none; color:var(--fg); }
.list span { color:var(--dim); font-size:14px; }
footer { color:var(--dim); font-size:13px; }
</style></head><body><main id="m"></main>

    + (goes.length ? '<section><h2>Goes with</h2><ul>' + goes.map(g => '<li><a href="#t' + encodeURIComponent(g) + '">' + esc(g.split('/')[1]) + '</a></li>').join('') + '</ul></section>' : '')
    + '<section><h2>' + (k.r ? 'Manuals from the maker' : 'Manual') + '</h2><ul>'
    + (k.r || []).map(r => '<li><a href="' + r[1] + '">' + esc(r[0]) + '</a></li>').join('')
    + '<li><a href="' + web(k.n + ' user manual') + '">' + (k.r ? 'Search for more manuals' : 'Search for the manual (a web search, not checked by us)') + '</a></li></ul></section>'
    + '<section><h2>Learn it</h2><ul>' + learn(k).map(l => '<li><a href="' + l[1] + '">' + esc(l[0]) + '</a></li>').join('') + '</ul><p class="sub" style="margin-top:8px">These open video and web searches for this exact item. We have not checked each result, so pick one that matches.</p></section>'
    + '<section><h2>Borrowing</h2><p>Checkouts and returns: IDeATe Lending desk, Hunt Library basement, room A29, across from the elevator. <a href="' + cat + '">See it in the library catalog</a></p></section>'
    + '<footer><a href="#">All items</a></footer>';
}
function list(title, rows) {
  document.title = 'IDeATe Lending item guide';
  m.innerHTML = '<h1>' + esc(title) + '</h1><input id="q" placeholder="Search by name" autocomplete="off"><div class="list" id="l"></div>';
  const l = document.getElementById('l'), draw = q => { l.innerHTML = rows.filter(i => !q || K[i].n.toLowerCase().includes(q)).slice(0, 80).map(i => '<a href="#k' + i + '">' + esc(K[i].n) + ' <span>' + esc(K[i].t) + '</span></a>').join('') || '<p class="sub">Nothing by that name</p>'; };
  document.getElementById('q').addEventListener('input', e => draw(e.target.value.trim().toLowerCase())); draw('');
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1)); window.scrollTo(0, 0);
  const q = new URLSearchParams(location.search).get('i');
  if (q && !h) { const j = K.findIndex(k => k.h === q.toLowerCase()); if (j >= 0) return item(j); }
  if (/^k\d+$/.test(h) && K[+h.slice(1)]) return item(+h.slice(1));
  if (h[0] === 't') { const [c, t] = h.slice(1).split('/'); const rows = K.map((k, i) => i).filter(i => K[i].c === c && K[i].t === t); if (rows.length) return list(t, rows); }
  list('IDeATe Lending item guide', K.map((k, i) => i));
}
addEventListener('hashchange', route); route();
</script>
