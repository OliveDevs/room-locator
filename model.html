<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Room Locator · 3D model of the room</title>
<style>html,body{margin:0;height:100%;background:#ece8df;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#20201e}#room3d{position:relative;line-height:0;touch-action:none}#room3d canvas{display:block;width:100%;cursor:grab}.room3d-tip{position:absolute;left:12px;bottom:12px;margin:0;padding:7px 11px;background:#fff;font-size:14px;line-height:1.3;font-weight:650;pointer-events:none}</style></head>
<body><div id="room3d"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="room3d.js?v=20261116e"></script>
<script>
Promise.all([fetch('data.json').then(r=>r.json()),fetch('room.json').then(r=>r.json())]).then(([data,room])=>{
  const unitBy=Object.fromEntries(room.units.map(u=>[u.code,u]));
  const below=(u,n)=>{while(n>1&&u.boards&&u.boards.length&&!u.boards.includes(n))n--;return n};
  const count=(c,n)=>data.kinds.filter(k=>k.u===c&&below(unitBy[c],k.s)===below(unitBy[c],n)).length;
  const view=Room3D.init(document.getElementById('room3d'),room,count,(u,n)=>view.mark([{unit:u,shelf:n,kind:'pick'}]),{spin:true,fill:true});
});
</script></body></html>
